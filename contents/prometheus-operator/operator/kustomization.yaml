resources:
  - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.94.1/bundle.yaml
# The upstream 10m CPU limit can throttle reloader startup on local kind nodes.
patches:
  - target:
      kind: Deployment
      name: prometheus-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --config-reloader-cpu-limit=100m
