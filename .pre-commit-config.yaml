# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: |
          (?x)(
            ^contents/strimzi/base-0.18.0/|
            ^contents/helm-vs-kustomize/helm-example/|
            ^contents/helm/hello-world/|
            contents/README.md$
          )
      # - id: check-added-large-files

  - repo: local
    hooks:
      - id: check-k8s-module-versions
        name: Check documented client-go/controller-runtime versions
        entry: python3 scripts/check_k8s_module_versions.py
        language: system
        pass_filenames: false
        always_run: true
      - id: generate-readme
        name: Synchronize README version indexes
        entry: go run readme.go
        language: system
        pass_filenames: false
        always_run: true
