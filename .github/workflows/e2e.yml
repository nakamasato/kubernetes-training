name: e2e
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test target selection and context isolation
        run: python3 -m unittest discover -s scripts/e2e -p 'test_*.py'
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            targets=$(python3 -c 'import json; print(json.dumps(sorted(json.load(open("scripts/e2e/targets.json")))))')
          else
            merge_base=$(git merge-base "$BASE" "$HEAD")
            git show "$merge_base:scripts/e2e/targets.json" > "$RUNNER_TEMP/e2e-base-targets.json"
            git show "$HEAD:scripts/e2e/targets.json" > "$RUNNER_TEMP/e2e-head-targets.json"
            targets=$(git diff --name-only --no-renames -z "$merge_base" "$HEAD" |
              python3 scripts/e2e/select_targets.py \
                --base-registry "$RUNNER_TEMP/e2e-base-targets.json" \
                --head-registry "$RUNNER_TEMP/e2e-head-targets.json")
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected targets: $targets"

  e2e:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go for the controller-runtime example
        if: matrix.target == 'controller-runtime'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind and kubectl
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: Install the documented Helm version
        if: matrix.target == 'helm'
        run: |
          version=$(python3 scripts/e2e/tool_version.py helm)
          curl -fsSL "https://get.helm.sh/helm-${version}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Install the documented Kustomize version
        if: matrix.target == 'kustomize'
        run: |
          version=$(python3 scripts/e2e/tool_version.py kustomize)
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${version}/kustomize_${version}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - name: Run E2E
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/e2e/run.sh "$TARGET"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.target }}
          path: .e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore

  status-check-e2e:
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and selected tests
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.e2e.result }}
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          test "$CHANGES" = success
          if [ "$TARGETS" = '[]' ]; then
            test "$E2E" = skipped
          else
            test "$E2E" = success
          fi
